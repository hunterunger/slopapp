name: Apps

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/**"
      - "templates/**"
      - "catalog/**"
      - "brand/**"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - "scripts/**"
      - "templates/**"
      - "catalog/**"
      - "brand/**"
      - ".github/workflows/apps.yml"

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, bundle, smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: scripts/check.sh
        run: scripts/check.sh

      - name: Upload apps and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopapp-apps
          path: |
            build/*.zip
            build/*-icon.png
            build/logs/
          if-no-files-found: ignore
