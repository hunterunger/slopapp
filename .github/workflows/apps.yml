name: Apps

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/**"
      - "templates/**"
      - "catalog/**"
      - "brand/**"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - "scripts/**"
      - "templates/**"
      - "catalog/**"
      - "brand/**"
      - ".github/workflows/apps.yml"
  # Run by hand on any branch, for some apps only:
  #   gh workflow run Apps --ref <branch> -f apps="Dictate Commit"
  workflow_dispatch:
    inputs:
      apps:
        description: "App folders to check, space-separated (empty: all)"
        required: false
        default: ""

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per app, in parallel: faster than checking every app in sequence, and a
  # failure names the app.
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: apps
        env:
          ONLY: ${{ inputs.apps }}
        run: |
          if [ -n "$ONLY" ]; then
            apps=$(for a in $ONLY; do [ -f "apps/$a/app.json" ] && echo "$a"; done | jq -R . | jq -sc .)
          else
            apps=$(for f in apps/*/app.json; do basename "$(dirname "$f")"; done | jq -R . | jq -sc .)
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.app }}
    needs: list
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: scripts/check.sh ${{ matrix.app }}
        run: scripts/check.sh "${{ matrix.app }}"

      - name: Upload app and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: |
            build/*.zip
            build/*-icon.png
            build/logs/
          if-no-files-found: ignore
