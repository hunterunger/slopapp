name: Suggest an improvement
description: An idea that would make one of the apps better.
title: "[App]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      # apps:begin (generated by scripts/catalog.mjs from apps/*/app.json)
      options:
        - Slopapp
        - Awake
        - Clips
        - Commit
        - Convert
        - Crate
        - Devkit
        - Dictate
        - Dropper
        - Focus
        - Gauge
        - Iconsmith
        - Paper
        - Ruler
        - Shorthand
        - Snapper
        - Specimen
        - Squish
        - Switchboard
        - Tally
        - Tidy
        - Triggers
        - Zones
        - Website
        - Not sure
      # apps:end
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job, not the button. Knowing what you're after lets us find the best fix.
      placeholder: I copy the same three addresses into forms every week.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      placeholder: Pinned items that stay at the top of Clips.
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: A workaround, or another app that does it well.
