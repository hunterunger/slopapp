name: Report a problem
description: Something in one of the apps doesn't work, crashes or looks wrong.
title: "[App]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Report a Problem…** in any app's menu fills in the app,
        version and macOS for you.

        Please leave out anything personal: no clipboard contents, file names, screenshots of
        your screen or anything from other apps.
  - type: dropdown
    id: app
    attributes:
      label: App
      description: Slopapp is the launcher (the app that installs the others).
      # apps:begin (generated by scripts/catalog.mjs from apps/*/app.json)
      options:
        - Slopapp
        - Awake
        - Clips
        - Commit
        - Convert
        - Crate
        - Devkit
        - Dictate
        - Dropper
        - Focus
        - Gauge
        - Iconsmith
        - Paper
        - Ruler
        - Shorthand
        - Snapper
        - Specimen
        - Squish
        - Switchboard
        - Tally
        - Tidy
        - Triggers
        - Zones
        - Website
        - Not sure
      # apps:end
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: In the app's About window, for example 0.1.0 (12).
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac.
      placeholder: macOS 15.2 on Apple silicon
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Clips stopped showing new items after I locked the screen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps, as exactly as you can. "Sometimes" is useful too.
      placeholder: |
        1. Copy some text
        2. Lock the screen and unlock it
        3. Copy something else and open Clips
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        A screenshot of just the app's window, or a crash report (Console > Crash Reports),
        helps a lot. Drag files in here.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you send it
      options:
        - label: I looked for an existing issue about this.
          required: true
